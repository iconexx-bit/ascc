[project]
name = "ascc"
version = "0.1.0"
description = "AI Security Command Center — correlation layer over Trivy, Prowler, Checkov"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yevhen Bashtanenko" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.16.1",
    "debugpy>=1.8",
    "jsonschema>=4.26.0",
    "pre-commit>=4.6.2",
]

[project.scripts]
ascc = "ascc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "env: environment invariants (gate for all other tests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Typer выражает CLI-параметры вызовом в дефолте аргумента — это его идиом,
# а не отложенная мутабельность, от которой защищает B008.
"src/ascc/cli.py" = ["B008"]