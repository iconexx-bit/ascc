[project]
name = "ascc"
version = "0.1.0"
description = "AI Security Command Center — correlation layer over Trivy, Prowler, Checkov"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yevhen Bashtanenko" }]
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.1", "debugpy>=1.8"]

[project.scripts]
ascc = "ascc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Typer выражает CLI-параметры вызовом в дефолте аргумента — это его идиом,
# а не отложенная мутабельность, от которой защищает B008.
"src/ascc/cli.py" = ["B008"]
