name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Conventional Commits header: type(scope)!: subject.
          # Scope is free-form kebab-case: the fixed scope list went stale and
          # rejected 117 of 153 commits on main. 100 = @commitlint/config-conventional.
          VALID_TYPES="feat|fix|docs|style|refactor|perf|test|build|chore|ci|security"
          PATTERN="^($VALID_TYPES)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*$"
          MAX_HEADER=100

          # The PR's own commits only. HEAD here is the synthetic merge commit
          # GitHub builds for pull_request events; origin/main..HEAD included it.
          FAILED=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            SUBJECT=$(git log --format=%s -n 1 "$commit")
            if ! printf '%s\n' "$SUBJECT" | grep -qE "$PATTERN" || [ "${#SUBJECT}" -gt "$MAX_HEADER" ]; then
              echo "❌ Invalid: $SUBJECT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "   Format: <type>(<scope>): <subject>, header <= $MAX_HEADER chars"
            echo "   Types: $VALID_TYPES"
            exit 1
          fi
          echo "✅ All commits valid"
