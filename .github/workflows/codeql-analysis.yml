name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Запуск каждое воскресенье в 00:00 UTC для выявления новых 0-day уязвимостей
    - cron: '0 0 * * 0'

# ГЛОБАЛЬНАЯ БЕЗОПАСНОСТЬ: Полный запрет всех прав по умолчанию
permissions: {}

jobs:
  analyze:
    name: Analyze Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Защита от бесконечного виса runner'а

    # ТОЧЕЧНЫЕ ПРАВА: Выдаем права строго под задачи CodeQL
    permissions:
      contents: read             # Для клонирования репозитория (checkout)
      security-events: write     # Для загрузки результатов в репозиторий (Security tab)
      actions: read              # Для анализа workflow-файлов (для некоторых языков)

    strategy:
      fail-fast: false
      matrix:
        # Укажи языки твоего проекта: 'cpp', 'csharp', 'go', 'java', 'javascript-typescript', 'python', 'ruby', 'swift'
        language: [ 'python' ]

    steps:
      # 1. Checkout, закреплён по SHA коммита (версия — в комментарии строки uses: его обновляет Dependabot)
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 2. Инициализация CodeQL, закреплена по SHA коммита
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Расширенный набор правил безопасности (включая качество кода и известные CWE)
          queries: security-extended,security-and-quality

      # 3. Автоматическая сборка (если язык компилируемый, например Java/C++/Go).
      # Для скриптовых языков (Python/JS) этот шаг можно пропустить.
      - name: Autobuild Project
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      # 4. Выполнение анализа и публикация SARIF-отчета
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
