name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

      - name: Test
        run: just test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужна полная история, не только последний коммит

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, secrets-scan]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: 🚨 Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "❌ **АЛЕРТ Blue Team:** Пайплайн `'"$GITHUB_WORKFLOW"'` завершился с ошибкой! Репозиторий: `'"$GITHUB_REPOSITORY"'`. Лог: '"$RUN_URL"'. Требуется проверка."}' \
               $DISCORD_WEBHOOK

      - name: 🚨 Notify Telegram
        if: env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
               -d chat_id=${CHAT_ID} \
               -d text="❌ АЛЕРТ: Сбой пайплайна ${GITHUB_WORKFLOW} в репозитории ${GITHUB_REPOSITORY}. Лог: ${RUN_URL}. Требуется проверка." \
               || echo "::warning::Telegram alert failed"
