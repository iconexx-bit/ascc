name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN is read-only unless a job widens it; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job pushes; keep GITHUB_TOKEN out of .git

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

      - name: Test
        run: just test

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # нужна полная история, не только последний коммит
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # review comments would need pull-requests: write

  notify-failure:
    runs-on: ubuntu-latest
    permissions: {}  # posts to webhooks with its own secrets; no GITHUB_TOKEN scope needed
    needs: [test, secrets-scan]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: 🚨 Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "❌ **АЛЕРТ Blue Team:** Пайплайн `'"$GITHUB_WORKFLOW"'` завершился с ошибкой! Репозиторий: `'"$GITHUB_REPOSITORY"'`. Лог: '"$RUN_URL"'. Требуется проверка."}' \
               $DISCORD_WEBHOOK

      - name: 🚨 Notify Telegram
        if: env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
               -d chat_id=${CHAT_ID} \
               -d text="❌ АЛЕРТ: Сбой пайплайна ${GITHUB_WORKFLOW} в репозитории ${GITHUB_REPOSITORY}. Лог: ${RUN_URL}. Требуется проверка." \
               || echo "::warning::Telegram alert failed"
