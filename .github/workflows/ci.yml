name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest tests/ -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужна полная история, не только последний коммит

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, secrets-scan]
    if: failure()
    steps:
      - name: 🚨 Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK пустой — секрет не подставился"
            exit 1
          fi
          curl -sS --fail-with-body -H "Content-Type: application/json" \
               -d '{"content": "❌ **АЛЕРТ Blue Team:** Пайплайн `'"$GITHUB_WORKFLOW"'` завершился с ошибкой! Репозиторий: `'"$GITHUB_REPOSITORY"'`. Лог: '"$RUN_URL"'. Требуется проверка."}' \
               "$DISCORD_WEBHOOK"

      - name: 🚨 Notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_TOKEN или TELEGRAM_CHAT_ID пустые — секреты не подставились"
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
               -d chat_id="${CHAT_ID}" \
               -d text="❌ АЛЕРТ: Сбой пайплайна ${GITHUB_WORKFLOW} в репозитории ${GITHUB_REPOSITORY}. Лог: ${RUN_URL}. Требуется проверка."
