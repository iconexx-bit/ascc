name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest tests/ -q

      - name: 🚨 Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "❌ **АЛЕРТ Blue Team:** Пайплайн `'"$GITHUB_WORKFLOW"'` завершился с ошибкой! Репозиторий: `'"$GITHUB_REPOSITORY"'`. Требуется проверка."}' \
               $DISCORD_WEBHOOK

      - name: 🚨 Notify Telegram on Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
               -d chat_id=${CHAT_ID} \
               -d text="❌ АЛЕРТ: Сбой пайплайна ${GITHUB_WORKFLOW} в репозитории ${GITHUB_REPOSITORY}. Интеграция прервана."

      - name: 🔍 Debug Telegram token/chat
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          echo "getMe:"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe"
          echo
          echo "getUpdates:"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates"
